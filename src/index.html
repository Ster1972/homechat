<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>Chat</title>
    
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <!-- Custom Style Sheet for Portal Redesign -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700;800&display=swap');
        
        :root {
            --bg-color: #08090c;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary-grad: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 50%, #121421 0%, #06070a 100%);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            margin: 0;
        }

        /* Ambient Glowing Blobs */
        .glow-blob {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.12) 0%, rgba(0,0,0,0) 70%);
            filter: blur(60px);
            z-index: 0;
            pointer-events: none;
        }
        .glow-blob-1 { top: 10%; left: 10%; }
        .glow-blob-2 { bottom: 10%; right: 10%; }

        .portal-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 3rem 2.5rem;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 10;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .portal-title {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 2.4rem;
            background: linear-gradient(135deg, #ffffff 40%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2.2rem;
            letter-spacing: -0.5px;
        }

        /* Floating Hero Image Outer Frame */
        .hero-img-container {
            width: 140px;
            height: 140px;
            margin: 0 auto 2rem auto;
            border-radius: 50%;
            padding: 6px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.3) 0%, rgba(168, 85, 247, 0.3) 100%);
            box-shadow: 0 15px 35px rgba(99, 102, 241, 0.25);
            animation: float 4.5s ease-in-out infinite;
        }

        .hero-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.15);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-8px) scale(1.03); }
        }

        /* Sleek Form styling */
        .form-floating-custom {
            position: relative;
            margin-bottom: 1.8rem;
        }

        .form-input-custom {
            width: 100%;
            background: rgba(255, 255, 255, 0.04) !important;
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
            border-radius: 14px !important;
            padding: 1.1rem 1.3rem !important;
            font-size: 1rem;
            color: var(--text-main) !important;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            outline: none;
        }

        .form-input-custom::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        .form-input-custom:focus {
            background: rgba(255, 255, 255, 0.07) !important;
            border-color: #a855f7 !important;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.3) !important;
        }

        .form-label-custom {
            display: block;
            margin-bottom: 0.6rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            text-align: left;
            padding-left: 4px;
        }

        /* Connecting glowing button */
        .btn-portal {
            width: 100%;
            background: var(--primary-grad);
            border: none;
            border-radius: 14px;
            padding: 1.1rem;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 1.1rem;
            color: #ffffff;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(168, 85, 247, 0.35);
            cursor: pointer;
        }

        .btn-portal:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(168, 85, 247, 0.5);
        }

        .btn-portal:active {
            transform: translateY(1px);
            box-shadow: 0 5px 15px rgba(168, 85, 247, 0.3);
        }

        .btn-portal::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.25),
                transparent
            );
            transition: 0.6s;
        }

        .btn-portal:hover::before {
            left: 100%;
        }
    </style>
</head>
<body>

    <!-- Ambient Ambient Glow Backdrop Orbs -->
    <div class="glow-blob glow-blob-1"></div>
    <div class="glow-blob glow-blob-2"></div>

    <div class="portal-card text-center">
        <!-- Floating Redesigned Hero Image -->
        <div class="hero-img-container">
            <img src="assets/img/tech2.jpg" alt="Game Chat Portal Graphic">
        </div>
        
        <h1 class="portal-title">Chat</h1>

        <!-- Room selector form -->
        <form id="roomForm" onsubmit="event.preventDefault(); storeData();">
            <div class="form-floating-custom">
                <label for="roomid" class="form-label-custom">Room Identifier</label>
                <input type="text" class="form-input-custom" id="roomid" placeholder="Enter room name..." required autocomplete="off">
            </div>
            
            <button type="button" class="btn-portal" onclick="storeData()">Connect Portal</button>
        </form>
    </div>

    <script>
        function storeData() {
            var roomid = document.getElementById("roomid").value.trim();
            
            if (document.getElementById('roomForm').checkValidity() && roomid !== "") {
                sessionStorage.setItem("roomName", roomid);
                window.location.href = "/welcome.html";
            } else {
                alert("Please enter a valid room name.");
            }
        }
    </script>
    
    <!-- Bootstrap Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
 
</body>
</html>
