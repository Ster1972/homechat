<!DOCTYPE html>
<html>
    <head>
        <title>4P Video Call</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black">    
        
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
   
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <style>
            body {
                overflow: hidden;
                height: 100vh;
                display: flex;
                flex-direction: column;
                margin: 0;
                background-color: #121212;
                color: white;
            }
            .video-container {
                width: 100%;
                height: 100%;
                object-fit: contain;
                background-color: #000;
            }
            .video-container-wrapper {
                position: relative;
                padding: 5px;
                display: flex;
                justify-content: center;
                align-items: center;
                overflow: hidden;
                aspect-ratio: 16 / 9;
                max-width: 100%;
                max-height: 100%;
            }
            #video-grid {
                display: flex;
                height: calc(100vh - 120px);
                width: 100%;
                margin: 0;
                padding: 10px;
                overflow: hidden;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                align-content: center;
            }
            /* Quadrant Layout (Default) */
            #video-grid.quadrant-layout .video-container-wrapper {
                flex: 0 1 48%;
                max-height: 48%;
            }
            /* Adjustments for fewer participants in Quadrant View */
            #video-grid.quadrant-layout .video-container-wrapper:only-child {
                flex: 0 1 90%;
                max-height: 90%;
            }
            #video-grid.quadrant-layout .video-container-wrapper:first-child:nth-last-child(2),
            #video-grid.quadrant-layout .video-container-wrapper:first-child:nth-last-child(2) ~ .video-container-wrapper {
                flex: 0 1 48%;
                max-height: 90%;
            }
            /* Column Layout */
            #video-grid.column-layout {
                flex-direction: column;
                flex-wrap: nowrap;
                align-items: center;
            }
            #video-grid.column-layout .video-container-wrapper {
                flex: 1;
                width: auto;
                height: auto;
            }
            .buttons {
                background-color: #121212;
                padding: 10px 0;
            }
            center h2 {
                margin: 10px 0;
                font-size: 1.5rem;
            }
        </style>
    </head>

    <body>
        <center><h2>Video Chat App</h2></center>
        
        <div class="container-fluid p-0">
            <div id="video-grid" class="quadrant-layout">
                <div class="video-container-wrapper" id="local-video-container">
                    <video class="local-video video-container" id='local' volume="0" preload='none' autoplay muted playsinline disablepictureinpicture></video>
                </div>
            </div>
        </div>
        
        <div class="buttons d-flex justify-content-center mb-3">
            <button type="button" class="btn btn-primary mx-2" id="toggle-video" title="Hide Video">
                <i class="bi bi-camera-video-fill" id="buttonVideo"></i>
            </button>
            <button type="button" class="btn btn-primary mx-2" id="toggle-mute" title="Mute">
                <i class="bi bi-mic-fill" id="buttonAudio"></i>
            </button>
            <button type="button" class="btn btn-primary mx-2" id="toggle-layout" title="Column View">
                <i class="bi bi-view-stacked" id="buttonLayout"></i>
            </button>
        </div>
        
        
        <script src='/socket.io/socket.io.js' defer></script>
        <script type='module' src='assets/js/rtc.js' defer></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  
        <script src="https://webrtc.github.io/adapter/adapter-latest.js" defer></script>
    </body>
</html>
