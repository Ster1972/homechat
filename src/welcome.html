<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">    
    <title>Game Chat - Video Call</title>
    
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700;800&display=swap');
        
        :root {
            --bg-color: #06070a;
            --primary-grad: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --glass-card: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --red-grad: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
            --active-green: #10b981;
        }

        body {
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            margin: 0;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 50%, #0f1122 0%, #040507 100%);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
        }

        /* Immersive calling theatre grid layout */
        main {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        #video-grid {
            display: flex;
            flex: 1;
            min-height: 0;
            width: 100%;
            margin: 0;
            padding: 20px;
            overflow: hidden;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            align-content: center;
            gap: 20px;
            z-index: 10;
        }

        /* Participant video cards */
        .video-container-wrapper {
            position: relative;
            background-color: #08090c;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.55),
                        inset 0 1px 1px rgba(255, 255, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            aspect-ratio: 16 / 9;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .video-container-wrapper:hover {
            transform: translateY(-4px);
            box-shadow: 0 25px 55px rgba(0, 0, 0, 0.75);
            border-color: rgba(168, 85, 247, 0.35);
        }

        .video-container {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background-color: #08090c;
            border-radius: 20px;
        }

        /* Mirror mode styling */
        .mirror-mode {
            transform: scaleX(-1);
        }

        /* Quadrant Layout Rules */
        #video-grid.quadrant-layout .video-container-wrapper {
            flex: 0 1 calc(50% - 20px);
            max-height: calc(50% - 10px);
        }

        #video-grid.quadrant-layout .video-container-wrapper:only-child {
            flex: 0 1 min(960px, 90%);
            max-height: 85%;
        }

        #video-grid.quadrant-layout .video-container-wrapper:first-child:nth-last-child(2),
        #video-grid.quadrant-layout .video-container-wrapper:first-child:nth-last-child(2) ~ .video-container-wrapper {
            flex: 0 1 calc(50% - 20px);
            max-height: 85%;
        }

        /* Column Layout Rules */
        #video-grid.column-layout {
            flex-direction: column;
            flex-wrap: nowrap;
            align-items: center;
        }

        #video-grid.column-layout .video-container-wrapper {
            flex: 1;
            width: auto;
            max-width: 80%;
            height: auto;
        }

        /* Bottom Floating Controller Bar container */
        .buttons-container {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 8px 0 16px 0;
            z-index: 100;
        }

        .buttons {
            background: rgba(6, 7, 10, 0.55) !important;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            padding: 6px 12px;
            border-radius: 50px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4),
                        inset 0 1px 0 rgba(255, 255, 255, 0.05);
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 0 !important;
        }

        /* Control Buttons (Reduced by 50%) */
        .btn-control {
            width: 26px;
            height: 26px;
            border-radius: 50% !important;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
            background: rgba(255, 255, 255, 0.04) !important;
            color: #d1d5db !important;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1) !important;
            cursor: pointer;
            padding: 0 !important;
        }

        .btn-control:hover {
            background: rgba(255, 255, 255, 0.12) !important;
            border-color: rgba(255, 255, 255, 0.2) !important;
            color: #ffffff !important;
            transform: translateY(-1.5px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .btn-control:active {
            transform: translateY(0);
        }

        .btn-control i {
            font-size: 0.65rem;
            display: inline-flex;
        }

        /* Modern CSS :has() selectors for toggle active styles */
        .btn-control:has(.bi-camera-video-off-fill),
        .btn-control:has(.bi-mic-mute-fill) {
            background: var(--red-grad) !important;
            border-color: rgba(239, 68, 68, 0.4) !important;
            color: #ffffff !important;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.4);
            animation: pulse-red 2s infinite;
        }

        @keyframes pulse-red {
            0%, 100% { box-shadow: 0 0 8px rgba(239, 68, 68, 0.4); }
            50% { box-shadow: 0 0 14px rgba(239, 68, 68, 0.65); }
        }

        .btn-control:has(.bi-grid-3x3-gap-fill) {
            background: var(--primary-grad) !important;
            border-color: rgba(168, 85, 247, 0.4) !important;
            color: #ffffff !important;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.35);
        }

        /* Specific Disconnect button design overrides */
        .btn-disconnect {
            background: var(--red-grad) !important;
            border-color: rgba(239, 68, 68, 0.4) !important;
            color: #ffffff !important;
        }

        .btn-disconnect:hover {
            background: linear-gradient(135deg, #f87171 0%, #dc2626 100%) !important;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.5) !important;
        }
    </style>
</head>

<body>
    <!-- Immersive calling Theatre Grid -->
    <main class="container-fluid p-0">
        <div id="video-grid" class="quadrant-layout">
            <div class="video-container-wrapper" id="local-video-container">
                <video class="local-video video-container" id="local" volume="0" preload="none" autoplay muted playsinline disablepictureinpicture></video>
            </div>
        </div>
    </main>
    
    <!-- Bottom Floating Frosted Controller bar -->
    <div class="buttons-container">
        <div class="buttons">
            <button type="button" class="btn-control" id="toggle-video" title="Hide Video">
                <i class="bi bi-camera-video-fill" id="buttonVideo"></i>
            </button>
            <button type="button" class="btn-control" id="toggle-mute" title="Mute">
                <i class="bi bi-mic-fill" id="buttonAudio"></i>
            </button>
            <button type="button" class="btn-control" id="toggle-layout" title="Column View">
                <i class="bi bi-view-stacked" id="buttonLayout"></i>
            </button>
            <button type="button" class="btn-control btn-disconnect" id="disconnect-btn" title="Disconnect Call">
                <i class="bi bi-telephone-x-fill"></i>
            </button>
        </div>
    </div>
    
    <script src="/socket.io/socket.io.js" defer></script>
    <script type="module" src="assets/js/rtc.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://webrtc.github.io/adapter/adapter-latest.js" defer></script>
</body>
</html>
